<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <meta name="description" content="Gerenciador de links meus links em um só lugar." />
    <meta name="theme-color" content="#09090b" />
    <title>@joaomjbraga | Links</title>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body>
    <div class="app">
      <main>
        <nav aria-label="Links">
          <ul class="links" id="links"></ul>
        </nav>
      </main>
    </div>

    <div class="external-prompt" id="externalPrompt" hidden>
      <div
        class="external-prompt__card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="externalPromptTitle"
      >
        <h2 id="externalPromptTitle">Abrir no navegador?</h2>
        <p class="external-prompt__text" id="externalPromptText"></p>
        <button type="button" class="external-prompt__btn" id="externalOpenBtn">
          Abrir no navegador
        </button>
        <p class="external-prompt__manual" id="externalPromptManual"></p>
      </div>
    </div>

    <script src="js/icons.js" defer></script>
    <script src="js/links.js" defer></script>
    <script src="js/external-browser.js" defer></script>
  </body>
</html>
